name: keep-supabase-alive

on:
  schedule:
    - cron: '17 9 * * *'      # todo dia, 09:17 UTC (06:17 BRT)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (mantem o projeto acordado)
        run: |
          URL="https://orcctjbosfdtxdfdhnbx.supabase.co/rest/v1/mimo_pacientes?select=id&limit=1"
          KEY="sb_publishable_oNu_rbujM-PNfsfO8Cod5Q_EREIbAbA"

          corpo=$(mktemp)
          code=$(curl -sS -o "$corpo" -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL" || true)

          echo "HTTP: $code"
          echo "Resposta: $(head -c 400 "$corpo")"

          # Qualquer coisa que nao seja 2xx DERRUBA o job. O keep-alive antigo
          # so falhava se a conexao caisse, entao 401/404/503 fechavam verde
          # dizendo "segue acordado" enquanto o projeto pausava.
          case "$code" in
            2[0-9][0-9]) echo "OK - o banco respondeu. Projeto acordado." ;;
            000)         echo "::error::Sem resposta do Supabase (conexao falhou)."; exit 1 ;;
            401|403)     echo "::error::Chave recusada ($code) - a publishable key mudou?"; exit 1 ;;
            404)         echo "::error::Tabela mimo_pacientes nao encontrada ($code)."; exit 1 ;;
            503|540)     echo "::error::Projeto PAUSADO ou indisponivel ($code) - restaurar no painel do Supabase."; exit 1 ;;
            *)           echo "::error::Resposta inesperada ($code)."; exit 1 ;;
          esac
